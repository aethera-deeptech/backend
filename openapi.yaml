openapi: 3.1.0
info:
  title: Aethera API
  version: 0.1.0
  summary: The API of the energy audit dashboard for small businesses
  description: |
    The API serves two clients. The web app of a business reads and writes under `/v1`, and the gateway of a business sends its readings under `/device/v1`. Every amount of money is a whole number of rupiah. Every moment is ISO 8601 and the service stores it in UTC. The moments of the home screen, the running report, the devices and the relay are written with the offset of the time zone of the business. The other moments of `/v1` and the moments in the answers under `/device/v1` are written in UTC with `Z`. The times that a gateway sends in its batches are Unix seconds.

    The paths under `/v1` that the frontend already assumes keep the shapes of `docs/api-assumptions.md` of the frontend repository. Where this file adds to them, the text says so.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
  contact:
    name: Aethera
    url: https://github.com/aethera-deeptech/backend
servers:
  - url: https://aethera-api.syafahadyan.com
    description: Production
tags:
  - name: Health
    description: Routes for the container and for a monitor
  - name: Account
    description: Sign up, verify, sign in, sign out and reset the password
  - name: Beranda
    description: The home screen
  - name: Saran
    description: The tips and the decisions on them
  - name: Alat
    description: The devices of a business
  - name: Pasang alat
    description: Rooms, gateways and the pairing of a new device
  - name: Produksi
    description: The production records
  - name: Laporan
    description: The monthly report
  - name: Pengaturan
    description: The settings of a business
  - name: Gateway
    description: The routes that the gateway of a business calls, with its key as a bearer token
security:
  - session: []
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Say how the process and its database are
      description: It answers 503 while the database does not answer. The container health check only marks the copy unhealthy for that and nothing restarts it, and the rolling update reads the version from it and waits for status ok.
      security: []
      responses:
        "200":
          description: The process runs and the database answers
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptimeSeconds, checks]
                properties:
                  status: {type: string, const: ok}
                  version: {type: string, examples: ["0.1.0"]}
                  uptimeSeconds: {type: integer, minimum: 0, description: Seconds since this copy started}
                  checks:
                    type: object
                    required: [database]
                    properties:
                      database: {type: string, enum: [ok, busy], description: "busy when the check timed out while every connection of the pool was in use, which still answers 200"}
                      mail: {type: string, enum: [smtp, log], description: smtp when a mail server is set and log when the links go to the log}
                  pool:
                    type: object
                    description: Connections of the database pool of this copy
                    properties:
                      acquired: {type: integer, minimum: 0}
                      idle: {type: integer, minimum: 0}
                      max: {type: integer, minimum: 0}
        "503":
          description: The database does not answer
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptimeSeconds, checks]
                properties:
                  status: {type: string, const: down}
                  version: {type: string, examples: ["0.1.0"]}
                  uptimeSeconds: {type: integer, minimum: 0}
                  checks:
                    type: object
                    required: [database]
                    properties:
                      database: {type: string, const: down}
                      mail: {type: string, enum: [smtp, log]}
                  pool:
                    type: object
                    properties:
                      acquired: {type: integer, minimum: 0}
                      idle: {type: integer, minimum: 0}
                      max: {type: integer, minimum: 0}
        "4XX": {$ref: "#/components/responses/Error"}
  /readyz:
    get:
      tags: [Health]
      operationId: getReady
      summary: Say that the service can do its work
      security: []
      responses:
        "200":
          description: The database answers
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ready}
        "503":
          description: The database does not answer
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: unavailable}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/auth/register:
    post:
      tags: [Account]
      operationId: register
      summary: Create a business and its owner and send the verification email
      description: "The sign up counts as the consent to the terms and the privacy policy, and the service stores the time and the version of the texts. The answer is the same wait time for every email, but a second sign up with a taken email answers 409, as the frames of the app show \"Email sudah terdaftar\". That reveals which emails have an account, so the route has a limit for each address of the client."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, email, password]
              properties:
                businessName: {$ref: "#/components/schemas/BusinessName"}
                email: {$ref: "#/components/schemas/Email"}
                password: {$ref: "#/components/schemas/Password"}
      responses:
        "201":
          description: The account exists and the email is sent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerificationSent"}
        "409": {$ref: "#/components/responses/EmailTaken"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Busy"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/login:
    post:
      tags: [Account]
      operationId: login
      summary: Sign in with an email and a password
      description: "A wrong password and an unknown email give the same answer in the same time. The code `email_not_verified` only comes after the password was right, so it does not reveal which emails exist. The cookie is set on success."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {$ref: "#/components/schemas/Email"}
                password: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie: {$ref: "#/components/headers/SessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/InvalidCredentials"}
        "403": {$ref: "#/components/responses/EmailNotVerified"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Busy"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/google:
    post:
      tags: [Account]
      operationId: loginWithGoogle
      summary: Sign in or sign up with a Google ID token
      description: "The service checks the signature, the audience, the expiry and `email_verified` of the token. A new Google account gets a business with the placeholder name `Usaha saya`, until the owner sets a name with `PATCH /v1/settings`. A Google email that already has a password account is refused with `google_failed`, so a person who controls only the Google side cannot take over the account. The route answers 503 `google_unavailable` while the service has no Google client id."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: {type: string, minLength: 1, maxLength: 4096}
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie: {$ref: "#/components/headers/SessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401":
          description: The token is not valid, or the email belongs to a password account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                failed: {value: {code: google_failed, message: The Google sign in failed}}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: The service has no Google client id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/account:
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Delete the account and the business with everything under it
      description: "The password is checked again, so a stolen session cannot delete the account alone. The delete takes the business and everything under it. That covers the user, the sessions, the gateways with their keys, the nodes, the devices, the readings, the anomalies, the tips, the relay commands and schedules, the rooms and the production records. It cannot be undone. The answer clears the cookie like logout. A wrong password answers 403 `invalid_credentials`, and not 401, because the session is still valid. The tries are limited to 5 an hour for each user. The big tables go first in batches, so a 503 `busy` can come after a part of the readings was deleted, or after the whole delete when the time ran out just after the commit. The same call can be repeated until it ends with 204. A 401 on the repeat means that the session is gone, which a finished delete causes, and so does a session that ended in the meantime. The app cannot tell the two apart from the answer, so it sends the user to the sign in page. A sign in with the right password works only while the account still exists, and a failed sign in proves nothing, because a wrong password gives the same answer."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, minLength: 1}
      responses:
        "204":
          description: The business is deleted and the cookie is cleared
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: The password is wrong (code `invalid_credentials`), or the CSRF header or the origin is missing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Busy"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/logout:
    post:
      tags: [Account]
      operationId: logout
      summary: End the session of this device
      responses:
        "204":
          description: The session is gone and the cookie is cleared
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/sessions:
    get:
      tags: [Account]
      operationId: listSessions
      summary: List the devices that are signed in
      description: The list holds the sessions of the user that can still sign in, at most 20. The session of this request comes first, and the others follow by the newest use. The label comes from the User-Agent of the sign in, such as `Chrome on Windows`, and the service keeps no address. `lastUsedAt` moves at most every 10 minutes.
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/sessions/{id}:
    delete:
      tags: [Account]
      operationId: endSession
      summary: End one session
      description: The id may name the session of this request, which then works like logout and also clears the cookie. The id of another user and an id that is not a uuid both answer 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: The session is gone
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/sessions/revoke-others:
    post:
      tags: [Account]
      operationId: revokeOtherSessions
      summary: Sign every other device out
      description: The session of this request stays valid. The route has no body. `ended` is 0 when no other session exists.
      responses:
        "200":
          description: The other sessions are gone
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended: {type: integer, minimum: 0, examples: [2]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Read who is signed in
      responses:
        "200":
          description: The signed in user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/verify-email:
    post:
      tags: [Account]
      operationId: verifyEmail
      summary: Verify an email with the token of the link and sign in
      description: The link in the email opens `/verify-email?token=` of the app, which calls this route. The token works once. A newer email makes the older tokens invalid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {$ref: "#/components/schemas/Token"}
      responses:
        "200":
          description: The email is verified and the user is signed in
          headers:
            Set-Cookie: {$ref: "#/components/headers/SessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "410": {$ref: "#/components/responses/TokenInvalid"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/resend-verification:
    post:
      tags: [Account]
      operationId: resendVerification
      summary: Send the verification email again
      description: The answer is 202 for every email, so the route does not reveal which emails exist. A second request within 60 seconds for the same email answers 429 `resend_too_soon` with `retryAfterSeconds`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {$ref: "#/components/schemas/Email"}
      responses:
        "202":
          description: The email is sent when the account exists and is not verified
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerificationSent"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/change-email:
    post:
      tags: [Account]
      operationId: changeEmail
      summary: Change the email of an account that is not verified yet
      description: This is the "Ganti email" link of the verification screen. It needs the current email and password, because the user is not signed in. It sends a new verification email to the new address, and the older tokens stop working. A verified account cannot use it, and a new address that equals the current one answers 422 with `newEmail` invalid, also for a verified account, because that check comes first.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, newEmail]
              properties:
                email: {$ref: "#/components/schemas/Email"}
                password: {type: string, minLength: 1, maxLength: 128}
                newEmail: {$ref: "#/components/schemas/Email"}
      responses:
        "202":
          description: The new address got the verification email
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerificationSent"}
        "401": {$ref: "#/components/responses/InvalidCredentials"}
        "409":
          description: The new address has an account (code `email_taken`), or the account is verified already and cannot change its address here (code `already_verified`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Busy"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/forgot-password:
    post:
      tags: [Account]
      operationId: forgotPassword
      summary: Send a link to reset the password
      description: The answer is 202 for every email and takes about the same time, so the route does not reveal which emails exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {$ref: "#/components/schemas/Email"}
      responses:
        "202":
          description: The email is sent when the account exists
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerificationSent"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/auth/reset-password:
    post:
      tags: [Account]
      operationId: resetPassword
      summary: Set a new password with the token of the link
      description: The token works once. A reset ends every session of the user, and the user signs in again with the new password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {$ref: "#/components/schemas/Token"}
                password: {$ref: "#/components/schemas/Password"}
      responses:
        "204":
          description: The password is changed
        "410": {$ref: "#/components/responses/TokenInvalid"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Busy"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/settings:
    get:
      tags: [Pengaturan]
      operationId: getSettings
      summary: Read the settings of the business
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}
    patch:
      tags: [Pengaturan]
      operationId: updateSettings
      summary: Change the settings of the business
      description: "The body has only the fields that change. The key of the tariff is `tariffRpPerKwh` here and `tariff.rpPerKwh` in the answer of the GET, because the frontend was written against that shape. A `tariffRpPerKwh` of null goes back to the default. The answer is the new settings."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SettingsPatch"}
      responses:
        "200":
          description: The new settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/Validation"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/rooms:
    get:
      tags: [Pasang alat]
      operationId: listRooms
      summary: List the rooms of the business
      responses:
        "200":
          description: The rooms, ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Room"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}
    post:
      tags: [Pasang alat]
      operationId: createRoom
      summary: Add a room
      description: This route is new. The frames have no way to add a room, and a business with no rooms cannot add a device without it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {$ref: "#/components/schemas/Name40"}
      responses:
        "201":
          description: The room
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Room"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: A room with this name exists (code `room_exists`), or the business has 100 rooms (code `too_many_rooms`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/gateways:
    get:
      tags: [Pasang alat]
      operationId: listGateways
      summary: List the gateways of the business
      description: The gateway is the only unit that talks to the service. The nodes send their readings to it over ESP-NOW.
      responses:
        "200":
          description: The gateways
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Gateway"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}
    post:
      tags: [Pasang alat]
      operationId: claimGateway
      summary: Claim a gateway with the code that it shows
      description: A new gateway asks for a claim code at `/device/v1/enroll` and shows it on its display. The owner types the code here and the gateway belongs to the business. A code works once and for 10 minutes. A gateway that the same business claimed before keeps its readings and gets the new key. A gateway of another business answers 409 `gateway_claimed_elsewhere`. A business can have at most 10 gateways, and the next claim answers 409 `too_many_gateways`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimCode, name]
              properties:
                claimCode: {type: string, pattern: "^[A-Z2-9]{8}$"}
                name: {$ref: "#/components/schemas/Name40"}
      responses:
        "201":
          description: The gateway belongs to the business now
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Gateway"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: The code is unknown, used or expired (code `claim_code_unknown`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The gateway belongs to another business (code `gateway_claimed_elsewhere`), the business has the most gateways that it can have (code `too_many_gateways`), or a value that must be unique is taken already, which is the key of another gateway in most cases and the hardware id when two claims for the same gateway ran at the same time (code `key_in_use`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/gateways/{id}/revoke-key:
    post:
      tags: [Pasang alat]
      operationId: revokeGatewayKey
      summary: Cut off the key of a gateway
      description: The old key answers 401 `invalid_gateway_key` from then on. The devices and the readings stay, and the list shows `keyRevoked` as true until the hardware enrolls again with a new key and the owner claims its new code with `POST /v1/gateways`. The route has no body and returns no claim code, because the gateway makes its own code when it enrolls. The same call twice is fine. A claim code that waits for the same hardware is removed, so the gateway has to enroll again with a new key. An id of another business, an unknown id and an id that is not a plain lower case uuid all answer 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: The key is cut off
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/pairings:
    post:
      tags: [Pasang alat]
      operationId: startPairing
      summary: Start the search for a new device
      description: "The business must have a gateway. The next node of this kind that the gateway reports as unclaimed becomes the device. The pairing ends as `failed` after 3 minutes. A business can have one pairing at a time, and a second request answers 409."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, roomId]
              properties:
                kind: {$ref: "#/components/schemas/DeviceKind"}
                name: {$ref: "#/components/schemas/Name40"}
                roomId: {type: string, format: uuid}
      responses:
        "201":
          description: The pairing
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: "A pairing is running (code `pairing_running`, with the id of that search in `pairingId` when it is available, otherwise wait for it to end), or the business has no gateway (code `no_gateway`)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/pairings/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Pasang alat]
      operationId: getPairing
      summary: Read the state of a pairing
      description: The app asks again every 3 seconds while the status is `searching`. `failed` covers a search that timed out after 3 minutes and a search that the owner stopped. `connected` has the id of the new device. The device exists as soon as the first reading of the node has arrived, so there is no state between `searching` and `connected`.
      responses:
        "200":
          description: The pairing
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [searching, connected, failed]}
                  deviceId: {type: [string, "null"], format: uuid}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "4XX": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Pasang alat]
      operationId: cancelPairing
      summary: Stop the search
      description: This route is new. The frames only have a back button, and without it the business cannot start another pairing for 3 minutes.
      responses:
        "204":
          description: The pairing is cancelled, or was already over
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/devices:
    get:
      tags: [Alat]
      operationId: listDevices
      summary: List the devices
      description: The list is ordered by status (anomali, offline, siaga, nyala, mati) and then by name. An empty list means that no device is installed. The app filters by status on its own side.
      responses:
        "200":
          description: The devices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/DeviceListItem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/devices/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Alat]
      operationId: getDevice
      summary: Read one device
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "4XX": {$ref: "#/components/responses/Error"}
    patch:
      tags: [Alat]
      operationId: renameDevice
      summary: Rename a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {$ref: "#/components/schemas/Name40"}
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/devices/{id}/energy-reset:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Alat]
      operationId: resetDeviceEnergy
      summary: Start the energy total of a device again
      description: "Sets the reset time of the device to now, for a plug or a clamp. The request has no body. The total `energySince` of the device then counts from the next whole hour. No reading is deleted, and the day, the month, the bill, the tips and the reports do not change. A second call replaces the time, and the old time cannot be brought back."
      responses:
        "200":
          description: The time of the reset
          content:
            application/json:
              schema:
                type: object
                required: [resetAt]
                properties:
                  resetAt: {type: string, format: date-time}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/devices/{id}/relay:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Alat]
      operationId: getRelay
      summary: Read the relay of a plug
      description: "`state` is the last state that the plug reported, or `unknown` while it never reported one. `pending` is a command that waits for the gateway or that the gateway fetched and did not answer yet. `last` is the newest command that ended. A device that is not a plug answers 409 with the code `no_relay`."
      responses:
        "200":
          description: The relay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Relay"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The device is a clamp and has no relay (code `no_relay`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "4XX": {$ref: "#/components/responses/Error"}
    post:
      tags: [Alat]
      operationId: sendRelayCommand
      summary: Switch the relay of a plug on or off
      description: "The service cannot call the gateway, because a gateway only calls out. It keeps the command until the gateway fetches it in the answer to its next batch of readings, which is within the sending interval of the gateway, and the gateway reports the result in a later batch. A command that no gateway fetched in 10 minutes expires, so a plug is never switched on an old order. A new command replaces the one that still waits. The answer 202 only says that the command is queued, and the app reads `GET` of this route to see the result. A business can send 60 commands in an hour. Only a command that was queued counts, so a call that is refused before it is queued, for example with a 404 or a 409, does not use it up."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [on, off]}
      responses:
        "202":
          description: The command is queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RelayPending"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The device is a clamp and has no relay (code `no_relay`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/devices/{id}/schedule:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Alat]
      operationId: setRelaySchedule
      summary: Set the daily switch of a plug
      description: "The times are local times of the business. The plug is switched off at `offAt` and, when `onAt` is set, on again at `onAt`, on the days that `days` names. The service looks at the schedules every minute and queues a command like the one of the owner. It never acts on a time that passed before the schedule was set, or more than 10 minutes ago, which is the life of a command. A second call replaces the schedule."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RelaySchedule"}
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RelaySchedule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The device is a clamp and has no relay (code `no_relay`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}
        "4XX": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Alat]
      operationId: deleteRelaySchedule
      summary: Remove the schedule of a plug
      description: A plug that has no schedule answers 204 as well.
      responses:
        "204": {description: The schedule is gone}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The device is a clamp and has no relay (code `no_relay`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/devices/{id}/power-loss:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Alat]
      operationId: setPowerLossChoice
      summary: Choose what a plug does after it loses its own power
      description: "`off` keeps the plug off and `last` brings it back to the state that it had. A new plug is on `off`. The service stores the choice and shows it in the relay view. A call with the same value answers 200 as well."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [afterPowerLoss]
              properties:
                afterPowerLoss: {type: string, enum: [off, last]}
      responses:
        "200":
          description: The choice that is stored now
          content:
            application/json:
              schema:
                type: object
                required: [afterPowerLoss]
                properties:
                  afterPowerLoss: {type: string, enum: [off, last]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The device is a clamp and has no relay (code `no_relay`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/beranda:
    get:
      tags: [Beranda]
      operationId: getBeranda
      summary: Read the home screen
      description: The field `phase` tells which shape follows.
      responses:
        "200":
          description: The home screen
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Beranda"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/recommendations:
    get:
      tags: [Saran]
      operationId: listRecommendations
      summary: List the tips
      responses:
        "200":
          description: The tips
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecommendationList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/recommendations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Saran]
      operationId: getRecommendation
      summary: Read one tip
      responses:
        "200":
          description: The tip
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recommendation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/recommendations/{id}/apply:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Saran]
      operationId: applyRecommendation
      summary: Record that the user applied the tip
      description: Allowed from `pending` and `deferred`. It starts the check of 14 days, which compares the energy for each piece with the 7 days before. Another state answers 409 `invalid_transition`.
      responses:
        "200":
          description: The tip
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recommendation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/recommendations/{id}/defer:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Saran]
      operationId: deferRecommendation
      summary: Record that the user chose "Nanti"
      description: Allowed from `pending` only, so a tip cannot be deferred twice.
      responses:
        "200":
          description: The tip
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recommendation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/recommendations/{id}/reject:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Saran]
      operationId: rejectRecommendation
      summary: Record that the user said no
      description: Allowed from `pending` and `deferred`. A rejected tip is final.
      responses:
        "200":
          description: The tip
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recommendation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/recommendations/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Saran]
      operationId: cancelRecommendation
      summary: Remove the record that the tip was applied
      description: Allowed from `applied` only. The progress of the check is erased and the tip waits for a decision again. A verified tip is final.
      responses:
        "200":
          description: The tip
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recommendation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/production:
    get:
      tags: [Produksi]
      operationId: listProduction
      summary: Read the production records
      responses:
        "200":
          description: The records
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Production"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/production/{date}:
    parameters:
      - {name: date, in: path, required: true, schema: {type: string, format: date}}
    get:
      tags: [Produksi]
      operationId: getProductionRecord
      summary: Read the record of one day
      description: This route is new. The form needs the record of a day that is older than the `recent` list, to tell a new record from a change.
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductionRecord"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "4XX": {$ref: "#/components/responses/Error"}
    put:
      tags: [Produksi]
      operationId: saveProductionRecord
      summary: Save the record of one day
      description: A day has one record, so saving a day that has one replaces it. A future day, a day more than 400 days back (`too_old`), a missing field (`required`), a quantity of 0 or less, and a quantity above 100000000 answer 422. The unit must be one of `units`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, unit]
              properties:
                quantity: {type: integer, minimum: 1, maximum: 100000000}
                unit: {type: string, minLength: 1, maxLength: 20}
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductionRecord"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/Validation"}
        "4XX": {$ref: "#/components/responses/Error"}

  /v1/reports:
    get:
      tags: [Laporan]
      operationId: getReport
      summary: Read the report of a month or a week
      description: Without `period` the answer is the running month. A period is a month such as `2026-09` or an ISO week such as `2026-W37`, which runs from Monday to Sunday in the time zone of the business. A period that has no report answers 404, and a period that is not shaped like either answers 422.
      parameters:
        - name: period
          in: query
          schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2]|W(0[1-9]|[1-4][0-9]|5[0-3]))$", examples: ["2026-09", "2026-W37"]}
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Report"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "4XX": {$ref: "#/components/responses/Error"}
  /v1/reports/{period}/pdf:
    parameters:
      - {name: period, in: path, required: true, schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2]|W(0[1-9]|[1-4][0-9]|5[0-3]))$"}}
    get:
      tags: [Laporan]
      operationId: getReportPdf
      summary: Download the report of a month or a week as one A4 page
      responses:
        "200":
          description: The PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "4XX": {$ref: "#/components/responses/Error"}

  /device/v1/enroll:
    post:
      tags: [Gateway]
      operationId: enrollGateway
      summary: Ask for a claim code
      description: "A gateway that has no key makes a random key of its own and calls this route with the SHA-256 of the key text exactly as it will send it in the bearer header (not of decoded bytes), written in lower case hex. The service accepts a key of 32 to 128 bytes of ASCII text, and 43 characters of base64url text from 32 random bytes is the recommendation. The service never sees the key itself. The answer holds the claim code that the gateway shows and a poll id. The route has a limit for each address of the client and for each hardware id. The code and the poll id are random and work once."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hardwareId, keyHash]
              properties:
                hardwareId: {type: string, minLength: 6, maxLength: 64, pattern: "^[A-Za-z0-9:_-]+$"}
                firmware: {type: string, maxLength: 32}
                keyHash: {type: string, pattern: "^[0-9a-f]{64}$"}
      responses:
        "201":
          description: The claim code
          content:
            application/json:
              schema:
                type: object
                required: [claimCode, pollId, expiresInSeconds]
                properties:
                  claimCode: {type: string, pattern: "^[A-Z2-9]{8}$"}
                  pollId: {type: string, minLength: 32, maxLength: 64}
                  expiresInSeconds: {type: integer, examples: [600]}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "4XX": {$ref: "#/components/responses/Error"}
  /device/v1/enroll/{pollId}:
    parameters:
      - {name: pollId, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 64}}
    get:
      tags: [Gateway]
      operationId: pollEnrollment
      summary: Ask whether the code was claimed
      description: The first answer after the claim says that the gateway belongs to a business now, and the gateway starts to send its readings with its key. The service removes the enrollment after that answer, so the next poll answers 404.
      security: []
      responses:
        "200":
          description: The code is claimed
          content:
            application/json:
              schema:
                type: object
                required: [gatewayId]
                properties:
                  gatewayId: {type: string, format: uuid}
        "202":
          description: Not claimed yet
        "404": {$ref: "#/components/responses/NotFound"}
        "410":
          description: The code expired (code `enrollment_expired`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "4XX": {$ref: "#/components/responses/Error"}
  /device/v1/readings:
    post:
      tags: [Gateway]
      operationId: sendReadings
      summary: Send a batch of readings of the nodes of a gateway
      description: "The gateway sends its key as a bearer token, see the scheme `gatewayKey`. A batch has a sequence number that grows by one for each batch. The service stores a batch once, so a retry of the last sequence number is answered with the last acknowledgement, stores nothing twice and still counts as a sign that the gateway is alive. A batch can hold readings of up to 24 hours, so a gateway that lost its Wi-Fi can catch up. A sample that is out of range or older than a day is dropped and counted in `rejected`, so one bad sample never blocks the gateway. The time stamps move by the difference between the clock of the gateway (`sentAt`) and the clock of the service. A node that has no device yet is kept as unclaimed and can be claimed by a pairing. A node that is built wrong, that repeats in the batch or that goes over the 64 nodes of a gateway is dropped with its samples, and the samples are counted in `rejected`. The body must not be compressed, or the answer is 415."
      security:
        - gatewayKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReadingBatch"}
      responses:
        "200":
          description: The batch is stored, or was stored before
          content:
            application/json:
              schema:
                type: object
                required: [ackSeq, serverTime, accepted, rejected, commands]
                properties:
                  ackSeq: {type: integer, minimum: 0}
                  serverTime: {type: string, format: date-time}
                  accepted: {type: integer, minimum: 0, description: The samples that were stored}
                  rejected: {type: integer, minimum: 0, description: The samples that were dropped}
                  commands:
                    type: array
                    description: The relay commands that wait for this gateway, oldest first. A command comes again in every answer until the gateway reports a result for it, so the gateway runs each id once.
                    items: {$ref: "#/components/schemas/RelayCommand"}
        "401": {$ref: "#/components/responses/InvalidGatewayKey"}
        "409":
          description: The sequence number is not the next one. `expectedSeq` says which one the service waits for.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: The batch is larger than 256 KiB or holds more than 5000 samples
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415":
          description: The body is compressed (code `unsupported_encoding`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "4XX": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-aethera_session
      description: "An opaque token in a cookie that is HttpOnly, Secure and SameSite=Lax, with no Domain, so only the API host reads it. The service stores only a hash of the token. The app and the API are on the same site, so SameSite=Lax cookies work with credentials. Every request that changes data must also carry the header `X-Requested-With: aethera`, and the service checks the `Origin` header against the origin of the app. The session lasts 30 days from the last use and at most 90 days in total."
    gatewayKey:
      type: http
      scheme: bearer
      description: "The key that the gateway made when it enrolled, sent as `Authorization: Bearer <key>`. The key is 32 to 128 bytes of ASCII text, and 32 random bytes in base64url (43 characters) is the recommendation. The service stores only its SHA-256, so a copy of the database cannot act as a gateway. TLS protects the key in transit, and the sequence number makes a retry safe."
  headers:
    SessionCookie:
      description: The session cookie
      schema: {type: string}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: A stable code for the app to react to, examples: [invalid_credentials]}
        message: {type: string, description: A text in English for a developer. The app writes its own texts.}
        fields:
          type: object
          description: The codes of the fields that failed, for example `{"password":"too_short"}`
          additionalProperties: {type: string}
        retryAfterSeconds: {type: integer, minimum: 1}
        expectedSeq: {type: integer, minimum: 0}
        pairingId: {type: string, format: uuid, description: "Only with the code `pairing_running`, the id of the search that already runs, so the app can open it with `GET /v1/pairings/{id}`"}
    Email: {type: string, format: email, maxLength: 254}
    Password: {type: string, minLength: 8, maxLength: 128, description: "At least 8 and at most 128 characters. A password on the list of about 1400 common passwords is refused with the code `too_common`, whatever its letter case. There is no rule about the kinds of characters."}
    Token: {type: string, minLength: 32, maxLength: 128}
    BusinessName: {type: string, minLength: 1, maxLength: 80, description: Between 1 and 80 characters after the spaces at both ends are removed}
    Name40: {type: string, minLength: 1, maxLength: 40, description: Between 1 and 40 characters after the spaces at both ends are removed}
    Room:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {$ref: "#/components/schemas/Name40"}
    Gateway:
      type: object
      required: [id, name, lastSeenAt, keyRevoked]
      properties:
        id: {type: string, format: uuid}
        name: {$ref: "#/components/schemas/Name40"}
        lastSeenAt: {type: string, format: date-time, description: The time of the last batch that the service stored or that the gateway sent again because its answer was lost. A gateway that never sent a batch shows the time of its claim.}
        keyRevoked: {type: boolean, description: "True after the owner cut off the key, until the hardware is claimed again with a new key. A gateway in this state sends nothing that the service accepts."}
    DeviceKind:
      type: string
      enum: [plug, clamp]
      description: "`plug` is a smart plug and `clamp` is a current clamp"
    DeviceStatus:
      type: string
      enum: [nyala, mati, siaga, offline, anomali]
    VerificationSent:
      type: object
      required: [retryAfterSeconds]
      properties:
        retryAfterSeconds: {type: integer, examples: [60]}
    Me:
      type: object
      required: [email, emailVerified, businessName]
      properties:
        email: {$ref: "#/components/schemas/Email"}
        emailVerified: {type: boolean}
        businessName: {type: string, description: "The name of the business. A Google sign up gets the placeholder `Usaha saya` until the owner sets a name."}
    Session:
      type: object
      required: [id, label, createdAt, lastUsedAt, current]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, minLength: 1, maxLength: 60, examples: [Chrome on Windows], description: "The browser and the system of the sign in. A sign in with no readable User-Agent, and a session that started before this field existed, has `Unknown device`."}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        current: {type: boolean, description: True for the session of this request}
    WorkHours:
      type: object
      required: [days, start, end]
      properties:
        days: {type: string, enum: [mon-fri, mon-sat, daily]}
        start: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        end: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: Later than start on the same day}
    Settings:
      type: object
      required: [businessName, workHours, tariff, anomalySensitivity, timeZone]
      properties:
        businessName: {type: string}
        workHours: {$ref: "#/components/schemas/WorkHours"}
        tariff:
          type: object
          required: [rpPerKwh, isDefault, defaultRpPerKwh]
          properties:
            rpPerKwh: {type: integer, minimum: 1}
            isDefault: {type: boolean}
            defaultRpPerKwh: {type: integer, minimum: 1, examples: [1444]}
        anomalySensitivity: {type: string, enum: [rendah, sedang, tinggi]}
        timeZone: {type: string, examples: [Asia/Jakarta], description: "An IANA zone name of a place, whose offset from UTC is a whole number of hours in every season, for example Asia/Jakarta. A zone such as Asia/Kolkata is refused, because the readings are summed in whole hours of UTC. This field is new and the frames have no screen for it."}
    SettingsPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        businessName: {$ref: "#/components/schemas/BusinessName"}
        workHours: {$ref: "#/components/schemas/WorkHours"}
        tariffRpPerKwh: {type: [integer, "null"], minimum: 1, maximum: 100000}
        anomalySensitivity: {type: string, enum: [rendah, sedang, tinggi]}
        timeZone: {type: string, minLength: 1, maxLength: 64}
    DeviceListItem:
      type: object
      required: [id, name, kind, status, currentPowerW, todayKwh]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {$ref: "#/components/schemas/DeviceKind"}
        status: {$ref: "#/components/schemas/DeviceStatus"}
        currentPowerW: {type: [number, "null"], description: Null while the device does not answer}
        todayKwh: {type: [number, "null"]}
        anomalyAt: {type: string, format: date-time, description: Only with the status anomali}
        lastSeenAt: {type: string, format: date-time, description: Only with the status offline}
    Device:
      type: object
      required: [id, name, status, room, kind, kindLabel, currentPowerW, todayKwh, monthKwh, onHoursToday, standbyW, lastSeenAt, signal, powerPattern, energySince]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {$ref: "#/components/schemas/DeviceStatus"}
        room: {type: string}
        kind: {$ref: "#/components/schemas/DeviceKind"}
        kindLabel: {type: string, examples: [WATTLINK Plug]}
        currentPowerW: {type: [number, "null"]}
        todayKwh: {type: [number, "null"]}
        monthKwh: {type: [number, "null"], description: "Stays set while the device is offline, because the month is still true"}
        onHoursToday: {type: [number, "null"]}
        standbyW: {type: [number, "null"]}
        lastSeenAt: {type: string, format: date-time, description: "The device exists only after its first reading, so this is always set"}
        signal: {type: string, enum: [baik, cukup, lemah, tidak-ada]}
        energySince:
          type: object
          description: "A total of the energy that the owner can start again with `POST /v1/devices/{id}/energy-reset`. It is not the day or the month, which do not change with a reset."
          required: [resetAt, kwh]
          properties:
            resetAt: {type: [string, "null"], format: date-time, description: "The time of the last reset, and null when the owner never made one"}
            kwh: {type: number, minimum: 0, description: "The energy of the whole hours from the reset on, so it begins at the next whole hour after `resetAt`. With no reset it is the energy of every hour that is kept, up to 400 days."}
        anomaly:
          type: object
          description: Only while the status is anomali
          required: [at, peakW, kind]
          properties:
            at: {type: string, format: date-time}
            peakW: {type: number}
            kind: {type: string, enum: [surge, overload, degradation], description: "surge is far above the usual power of that hour, overload is the condition that the node reports, and degradation is a loaded motor with a poor power factor, or the condition that the node reports for it"}
            powerFactor: {type: number, minimum: 0, maximum: 1, description: "Only for a degradation that the service found in the readings, the mean power factor of the poor samples"}
        powerPattern:
          type: [object, "null"]
          description: Null while there is no recent data. The points cover the 24 hours that end now, spread evenly.
          required: [points, yMaxW]
          properties:
            points:
              type: array
              minItems: 2
              description: "The highest power of each 15 minutes. A time with no reading is null and not 0, so a gap in the data, such as an outage of the gateway, is not shown as a device that was off."
              items: {type: [number, "null"], minimum: 0}
            yMaxW: {type: number}
            expected:
              type: object
              required: [low, high]
              properties:
                low: {type: array, minItems: 1, items: {type: number, minimum: 0}}
                high: {type: array, minItems: 1, items: {type: number, minimum: 0}}
            anomaly:
              type: object
              required: [from, to]
              properties:
                from: {type: integer, minimum: 0}
                to: {type: integer, minimum: 0}
    Savings:
      type: object
      required: [rp, count]
      properties:
        rp: {type: integer, minimum: 0}
        count: {type: integer, minimum: 0}
    EnergyPerPiece:
      oneOf:
        - type: object
          required: [status, beforeKwh, afterKwh]
          properties:
            status: {type: string, enum: [verified, estimate]}
            beforeKwh: {type: number, minimum: 0}
            afterKwh: {type: number, minimum: 0}
        - type: object
          required: [status, collectedDays, neededDays]
          properties:
            status: {type: string, const: collecting}
            collectedDays: {type: integer, minimum: 0}
            neededDays: {type: integer, minimum: 0}
    TopDevice:
      type: object
      required: [name, kwh]
      properties:
        name: {type: string}
        kwh: {type: number, minimum: 0}
    Beranda:
      type: object
      required: [phase, businessName, asOf]
      properties:
        phase: {type: string, enum: [no-devices, collecting, ready]}
        businessName: {type: string}
        asOf: {type: string, format: date-time}
        collectedDays: {type: integer, minimum: 0, description: Only with collecting}
        neededDays: {type: integer, minimum: 0, description: Only with collecting}
        savingPerMonthRp: {type: integer, minimum: 0, description: "Only with ready. It is the sum of the tips that wait for a decision."}
        statusCounts:
          type: object
          description: Only with ready
          required: [anomali, offline, siaga, nyala, mati]
          properties:
            anomali: {type: integer, minimum: 0}
            offline: {type: integer, minimum: 0}
            siaga: {type: integer, minimum: 0}
            nyala: {type: integer, minimum: 0}
            mati: {type: integer, minimum: 0}
        recommendations:
          type: array
          description: Only with ready
          items:
            type: object
            required: [id, title, deviceName, savingPerMonthRp]
            properties:
              id: {type: string, format: uuid}
              title: {type: string}
              deviceName: {type: string}
              savingPerMonthRp: {type: integer, minimum: 0}
        bill:
          type: object
          description: Only with ready
          required: [dailyTotalRp, projectedTotalRp, potentialTotalRp]
          properties:
            dailyTotalRp: {type: array, minItems: 1, maxItems: 31, items: {type: integer, minimum: 0}}
            projectedTotalRp: {type: integer, minimum: 0}
            potentialTotalRp: {type: integer, minimum: 0}
        topDevices:
          type: array
          maxItems: 4
          description: With collecting and ready
          items: {$ref: "#/components/schemas/TopDevice"}
        energyPerPiece: {$ref: "#/components/schemas/EnergyPerPiece"}
    TipStatus:
      type: string
      enum: [pending, deferred, applied, verified, rejected]
    RecommendationItem:
      type: object
      required: [id, title, savingPerMonthRp, status]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        savingPerMonthRp: {type: integer, minimum: 0}
        status: {$ref: "#/components/schemas/TipStatus"}
        progress:
          type: object
          description: Only with applied
          required: [collectedDays, neededDays]
          properties:
            collectedDays: {type: integer, minimum: 0}
            neededDays: {type: integer, minimum: 0}
        resultPercent: {type: number, description: "Only with verified. The drop of the energy for each piece in percent."}
    RecommendationList:
      type: object
      required: [phase, businessName]
      properties:
        phase: {type: string, enum: [no-devices, collecting, ready]}
        businessName: {type: string}
        neededDays: {type: integer, minimum: 0, description: Only with collecting}
        items: {type: array, description: Only with ready, items: {$ref: "#/components/schemas/RecommendationItem"}}
    Recommendation:
      type: object
      required: [id, title, deviceName, status, savingPerMonthRp, tariffIsDefault, whatToDo, why, howCalculated]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        deviceName: {type: string}
        status: {$ref: "#/components/schemas/TipStatus"}
        savingPerMonthRp: {type: integer, minimum: 0, description: Rounded to the nearest 1000 rupiah. It becomes the measured value when the tip is verified.}
        tariffIsDefault: {type: boolean}
        whatToDo: {type: string}
        why: {type: string}
        howCalculated: {type: array, minItems: 1, items: {type: string}}
        appliedAt: {type: string, format: date-time}
        rejectedAt: {type: string, format: date-time}
        verification:
          type: object
          description: Only while applied
          required: [collectedDays, neededDays]
          properties:
            collectedDays: {type: integer, minimum: 0}
            neededDays: {type: integer, minimum: 0}
        result:
          type: object
          description: Only after the verification
          required: [beforeKwh, afterKwh, beforeDays, afterDays]
          properties:
            beforeKwh: {type: number, minimum: 0}
            afterKwh: {type: number, minimum: 0}
            beforeDays: {type: integer, minimum: 0}
            afterDays: {type: integer, minimum: 0}
    ProductionRecord:
      type: object
      required: [date, quantity, unit]
      properties:
        date: {type: string, format: date}
        quantity: {type: integer, minimum: 1}
        unit: {type: string}
    Production:
      type: object
      required: [unit, units, today, recent]
      properties:
        unit: {type: string, examples: [potong]}
        units: {type: array, minItems: 1, items: {type: string}}
        today: {type: string, format: date, description: "The day of the business now, which is the last day the form lets the user pick"}
        recent:
          type: array
          description: The 3 newest records, newest first
          maxItems: 3
          items: {$ref: "#/components/schemas/ProductionRecord"}
    Report:
      type: object
      required: [phase, granularity, period, periods, weeks]
      properties:
        phase: {type: string, enum: [no-devices, collecting, ready]}
        granularity: {type: string, enum: [month, week], description: month for a period such as 2026-09 and week for a period such as 2026-W37}
        period: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2]|W(0[1-9]|[1-4][0-9]|5[0-3]))$", description: "A month such as 2026-09 or an ISO week such as 2026-W37, as granularity says", examples: ["2026-09", "2026-W37"]}
        periods:
          type: array
          description: The months that have a report, newest first
          items: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
        weeks:
          type: array
          description: The ISO weeks that have a report, newest first, as many as the 400 days that the hourly sums are kept
          items: {type: string, pattern: "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$"}
        collectedDays: {type: integer, minimum: 0, description: Only with collecting}
        neededDays: {type: integer, minimum: 0, description: Only with collecting}
        through: {type: string, format: date-time, description: Only for the running month or the running week}
        tariff:
          type: object
          description: The tariff of the report, so the text can say that the default was used
          required: [rpPerKwh, isDefault]
          properties:
            rpPerKwh: {type: integer, minimum: 1}
            isDefault: {type: boolean}
        saving:
          type: object
          description: Only with ready. The three sums are counted apart.
          required: [verified, applied, estimate]
          properties:
            verified:
              type: object
              required: [rp, count, checkedDays]
              properties:
                rp: {type: integer, minimum: 0}
                count: {type: integer, minimum: 0}
                checkedDays: {type: integer, minimum: 0}
            applied:
              type: object
              required: [rp, count, day, neededDays]
              properties:
                rp: {type: integer, minimum: 0}
                count: {type: integer, minimum: 0}
                day: {type: integer, minimum: 0}
                neededDays: {type: integer, minimum: 0}
            estimate: {$ref: "#/components/schemas/Savings"}
        topDevices: {type: array, maxItems: 4, items: {$ref: "#/components/schemas/TopDevice"}}
        billRp: {type: integer, minimum: 0}
        energyPerPiece: {$ref: "#/components/schemas/EnergyPerPiece"}
    Relay:
      type: object
      required: [state, reportedAt, gatewayOnline, cutByDevice, pending, last, schedule, afterPowerLoss]
      properties:
        afterPowerLoss: {type: string, enum: [off, last], description: "The choice of the owner for what the plug does after it loses its own power. A new plug is on `off`."}
        state: {type: string, enum: [on, off, unknown]}
        reportedAt: {type: [string, "null"], format: date-time, description: When the state was reported or confirmed}
        gatewayOnline: {type: boolean, description: "True when the gateway of the plug had a batch stored, or sent again after a lost answer, in the last 15 minutes, the same time limit as the status offline of a device. It describes the gateway and not the plug, so it can be true while the device is offline. A command is queued also when this is false, and it expires after 10 minutes if the gateway stays away"}
        cutByDevice:
          description: "Set while the relay is off because the plug cut it by itself after an overload, and null otherwise. It is the newest overload of the plug that is newer than the moment the gateway fetched the last command that the plug applied, and not older than 24 hours. The field is null while the state is on, and a command of the owner or of a schedule that the plug applied later ends it. It is an indication and not proof, because it only says that the relay is off and that a qualifying overload exists. The overload stays on record, so a plug that is switched on and then off by hand within 24 hours shows the same cause again. A plug that was switched off by hand, or that restarted with its relay off, after the overload still shows it until then. An overload within 6 hours of the one before it is not stored again, unless a command that switched the plug on was fetched by the gateway and applied after the first one and before the new one. Then the new overload is stored and the field shows it."
          oneOf:
            - type: object
              required: [reason, at]
              properties:
                reason: {type: string, enum: [overload]}
                at: {type: string, format: date-time, description: The time of the overload that the node reported}
            - type: "null"
        pending: {oneOf: [{$ref: "#/components/schemas/RelayPending"}, {type: "null"}]}
        last:
          oneOf:
            - type: object
              required: [action, status, source, at]
              properties:
                action: {type: string, enum: [on, off]}
                status: {type: string, enum: [applied, failed, expired], description: "applied is a switch that the plug confirmed, failed is one that the gateway could not do, and expired is one that no gateway fetched in time or that a newer command replaced"}
                source: {type: string, enum: [owner, schedule]}
                at: {type: string, format: date-time}
            - type: "null"
        schedule: {oneOf: [{$ref: "#/components/schemas/RelaySchedule"}, {type: "null"}]}
    RelayPending:
      type: object
      required: [id, action, status, expiresAt]
      properties:
        id: {type: string, format: uuid}
        action: {type: string, enum: [on, off]}
        status: {type: string, enum: [pending, sent], description: pending waits for the gateway and sent was fetched by it}
        expiresAt: {type: string, format: date-time}
    RelaySchedule:
      type: object
      required: [offAt, days]
      properties:
        enabled: {type: boolean, default: true, description: A paused schedule keeps its times and makes no command}
        offAt: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", examples: ["17:30"]}
        onAt: {type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", examples: ["08:00"], description: "Optional, and not the same as offAt"}
        days: {type: string, enum: [mon-fri, mon-sat, daily]}
    RelayCommand:
      type: object
      description: A relay command in the answer to a batch of readings. The gateway switches the relay of the node and reports the result with the same id in `results` of a later batch.
      required: [id, nodeId, action, expiresAt]
      properties:
        id: {type: string, format: uuid}
        nodeId: {type: string}
        action: {type: string, enum: [on, off]}
        expiresAt: {type: string, format: date-time, description: The gateway skips a command after this time}
    RelayResult:
      type: object
      required: [id, ok]
      properties:
        id: {type: string, format: uuid}
        ok: {type: boolean, description: true when the relay switched and false when it could not}
    Sample:
      type: object
      required: [t, p]
      properties:
        t: {type: integer, description: Unix seconds of the sample, minimum: 1700000000}
        v: {type: number, description: Volts, minimum: 0, maximum: 500}
        i: {type: number, description: Amperes, minimum: 0, maximum: 200}
        p: {type: number, description: Watts, minimum: 0, maximum: 60000}
        e: {type: number, description: Total energy of the node in kWh since it was made, minimum: 0}
        f: {type: number, description: Hertz, minimum: 0, maximum: 100}
        pf: {type: number, description: Power factor, minimum: 0, maximum: 1}
        r: {type: integer, enum: [0, 1], description: "The state of the relay of a plug, 1 for on and 0 for off"}
        a: {type: integer, minimum: 0, maximum: 3, description: "The condition that the gateway classified on its own. 0 is normal, 1 is standby, 2 is a degraded load (low power factor under high load) and 3 is an overload. The service keeps it and decides on its own too."}
    ReadingBatch:
      type: object
      required: [seq, sentAt, nodes]
      properties:
        seq: {type: integer, minimum: 1}
        sentAt: {type: integer, description: Unix seconds on the clock of the gateway}
        results:
          type: array
          maxItems: 64
          description: The answers to relay commands that an earlier answer carried. A result for a command that ended, or that is not one of this gateway, is ignored.
          items: {$ref: "#/components/schemas/RelayResult"}
        nodes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            required: [nodeId, kind, samples]
            properties:
              nodeId: {type: string, minLength: 6, maxLength: 32, pattern: "^[A-Za-z0-9:_-]+$", description: Unique inside one gateway. Two gateways may use the same id.}
              kind: {$ref: "#/components/schemas/DeviceKind"}
              hops: {type: integer, minimum: 0, maximum: 3, description: How many nodes relayed the packets}
              samples: {type: array, minItems: 1, maxItems: 1000, items: {$ref: "#/components/schemas/Sample"}}
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: There is no session, or it expired (code `unauthorized`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: The id does not exist, or it belongs to another business (code `not_found`). Both answer the same.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Validation:
      description: A field is not valid. `fields` names each one with a code such as `required`, `too_short`, `too_long`, `too_common` or `invalid`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Too many requests. `retryAfterSeconds` and the header `Retry-After` say when to try again (code `rate_limited`, or `resend_too_soon` for a resend).
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Busy:
      description: Every slot of the password check is taken, so the service sheds the request (code `busy`). Every route under `/v1` and `/device/v1` can also answer it, even where the route lists no 503, when the request ran for 10 seconds and failed. A write may have been saved just before the time ran out. `retryAfterSeconds` and the header `Retry-After` say when to try again, which is 2 seconds.
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidCredentials:
      description: The email or the password is wrong (code `invalid_credentials`). The answer is the same for an unknown email.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    EmailNotVerified:
      description: The password was right and the email is not verified (code `email_not_verified`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    EmailTaken:
      description: The email has an account (code `email_taken`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TokenInvalid:
      description: The token is unknown, used or expired (code `token_invalid_or_expired`). One answer covers all three.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidTransition:
      description: The tip is not in a state that allows this decision (code `invalid_transition`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidGatewayKey:
      description: The bearer key is missing or unknown (code `invalid_gateway_key`). One answer covers both.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
