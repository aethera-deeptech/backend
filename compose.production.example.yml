# Production example for the API of the energy audit dashboard, two copies on one host behind a reverse proxy. Copy it to the server
# as compose.yml next to the .env file, and update the copies with scripts/rolling-update.sh. The copies only listen on the loopback
# address of the host, so nothing reaches them except the reverse proxy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

x-api: &api
  image: syafa/aethera-backend:${IMAGE_TAG:?set IMAGE_TAG in the env file}
  restart: always
  # the service waits up to 15 seconds for the requests that are running after a stop signal, and Docker stops a container after
  # 10 seconds when nothing is set, so the default here is longer than the wait of the service
  stop_grace_period: ${API_STOP_GRACE_PERIOD:-20s}
  # a missing .env stops compose, because the file is required unless the entry says otherwise
  env_file:
    - .env
  environment:
    GOMEMLIMIT: ${GOMEMLIMIT:-100MiB}
  networks:
    - internal
    - database
  labels:
    aethera.role: api
    # the port of the metrics listener, as in METRICS_ADDRESS, which Alloy reads to find the scrape address of the copy
    aethera.metrics_port: "${METRICS_ADDRESS:-:9100}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  deploy:
    resources:
      limits:
        cpus: "${API_CPUS:-0.50}"
        memory: ${API_MEMORY_LIMIT:-128m}

services:
  api-1:
    <<: *api
    container_name: aethera-api-1
    ports:
      - "127.0.0.1:${API_1_HOST_PORT:-8010}:${APP_PORT:-8080}"

  api-2:
    <<: *api
    container_name: aethera-api-2
    ports:
      - "127.0.0.1:${API_2_HOST_PORT:-8011}:${APP_PORT:-8080}"

  # Metrics and logs go to Grafana Cloud. These two services only start with the `monitoring` profile, which is set with
  # COMPOSE_PROFILES=monitoring in .env once grafana/alloy/.env is filled in, see docs/monitoring.md. The copies need
  # METRICS_ADDRESS=:9100 in .env for the metrics.
  alloy:
    image: grafana/alloy:v1.21.0
    container_name: aethera-alloy
    restart: always
    profiles:
      - monitoring
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    # the token has its own file, which only this container loads, so the API copies never see it
    env_file:
      - path: grafana/alloy/.env
        required: true
    deploy:
      resources:
        limits:
          memory: ${ALLOY_MEMORY_LIMIT:-256m}
    volumes:
      - ./grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - aethera-alloy:/var/lib/alloy/data
    depends_on:
      - socket-proxy
    networks:
      - internal
      - docker-api
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # The only container of this stack that touches the Docker socket. It answers read requests for containers and networks and refuses
  # everything else, so Alloy cannot start, stop or create a container even if it is compromised.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: aethera-socket-proxy
    restart: always
    profiles:
      - monitoring
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  internal:
  # no route out and shared by the socket proxy and Alloy only, so nothing else can reach the Docker API
  docker-api:
    internal: true
  # the network of the shared database container, which already exists on the host. Compose never creates or removes it.
  database:
    external: true
    name: ${DB_NETWORK:-postgres_postgres}

volumes:
  aethera-alloy:
