name: Pull images through the Google mirror
description: >-
  Sends the image pulls of the Docker daemon through mirror.gcr.io, which serves the popular Docker Hub images without the pull limit
  of Docker Hub, and logs in to Docker Hub with a read-only token for the images that the mirror does not have.
inputs:
  username:
    description: The Docker Hub account of the token
    required: false
    default: ""
  token:
    description: A read-only Docker Hub access token, the login is skipped when it is empty
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Use the Google mirror of Docker Hub
      shell: bash
      run: |
        sudo mkdir -p /etc/docker
        existing="$(sudo cat /etc/docker/daemon.json 2>/dev/null || true)"
        if [ -z "$existing" ]; then existing='{}'; fi
        echo "$existing" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json > /dev/null
        sudo systemctl restart docker
        docker info --format 'mirrors: {{.RegistryConfig.Mirrors}} storage: {{.DriverStatus}}'

    - name: Log in to Docker Hub
      if: inputs.token != ''
      # a login that times out must not fail the job, the pulls that follow then go anonymously
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}
