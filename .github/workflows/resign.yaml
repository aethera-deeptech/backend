name: Re-sign image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version of an image that is already published, for example 0.4.0
        required: true
        type: string

concurrency:
  group: resign-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  resign:
    name: Sign an existing image again
    # The signature check accepts this workflow only when it ran on main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Docker Hub token is a secret of the docker-hub environment, which only main and version tags can use
    environment: docker-hub
    permissions:
      packages: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      HUB: ${{ vars.DOCKERHUB_USERNAME != '' }}
      HUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'local' }}/aethera-backend
    steps:
      - name: Check the version
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The tag must be a full version such as 0.4.0" >&2
            exit 1
          fi
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.HUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Find the digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')
          echo "GitHub Container Registry holds ${digest}"
          if [ "$HUB" = "true" ]; then
            hub_digest=$(docker buildx imagetools inspect "${HUB_IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')
            echo "Docker Hub holds ${hub_digest}"
            if [ "$digest" != "$hub_digest" ]; then
              echo "The two registries hold different images for ${TAG}, so nothing was signed" >&2
              exit 1
            fi
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # A tag only points at whatever the registry holds today. The build attestation is kept by GitHub and not by the registry,
      # so this proves that docker.yaml of this repository built these exact bytes before they get a new signature
      # The source ref has to be the tag of this version, because a pull request build is attested by the same workflow
      - name: Check that docker.yaml built this image
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh attestation verify "oci://${GHCR_IMAGE}@${DIGEST}" \
            --repo "$REPOSITORY" \
            --signer-workflow "${REPOSITORY}/.github/workflows/docker.yaml" \
            --source-ref "refs/tags/v${TAG}" \
            --predicate-type https://cyclonedx.org/bom

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Same classic format as docker.yaml, because GitHub Container Registry lists the default bundle under the wrong type
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes --use-signing-config=false --new-bundle-format=false "${GHCR_IMAGE}@${DIGEST}"
          if [ "$HUB" = "true" ]; then
            cosign sign --yes --use-signing-config=false --new-bundle-format=false "${HUB_IMAGE}@${DIGEST}"
          fi

      - name: Verify the signature
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          identity="^https://github\.com/${REPOSITORY}/\.github/workflows/resign\.yaml@refs/heads/main$"
          verify() {
            cosign verify \
              --new-bundle-format=false \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$1@${DIGEST}" > /dev/null
          }
          verify "$GHCR_IMAGE"
          if [ "$HUB" = "true" ]; then
            verify "$HUB_IMAGE"
          fi
