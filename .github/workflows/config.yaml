name: Config lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The image is the actionlint stage of .github/tools/Dockerfile, which the update bot keeps current
      - name: Lint workflows
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh actionlint)")"
          docker run --rm -v "$PWD:/repo" -w /repo "$image" -color

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        # the token lets the audits that ask GitHub about the actions in use run, such as the ones for known vulnerable
        # versions and for commits that are not on the branch they claim, which are skipped without it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo "$(bash ./.github/tools/image.sh zizmor)" \
            --no-progress --format github .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # every file that git tracks with the .sh ending, the settings are in .shellcheckrc
      - name: ShellCheck
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh shellcheck)")"
          mapfile -d '' files < <(git ls-files -z '*.sh')
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$image" "${files[@]}"

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The image is the redocly stage of .github/tools/Dockerfile. The rules are in redocly.yaml.
      - name: Lint openapi.yaml
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh redocly)")"
          docker run --rm -v "$PWD:/spec:ro" -w /spec "$image" lint openapi.yaml

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The image is the hadolint stage of .github/tools/Dockerfile, which the update bot keeps current
      - name: Lint Dockerfile
        run: |
          docker run --rm -i "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh hadolint)")" < Dockerfile

  dotenv:
    name: Dotenv lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The example file is grouped by topic and not sorted, so the check for the order of the keys is off
      - name: Lint the example env file
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh dotenv-linter)")" \
            check --skip-updates --plain --ignore-checks UnorderedKey .env.example

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker compose config reads the file and builds nothing and starts nothing. Nothing else uses the example file, so this is what
      # keeps it from drifting away from the settings in .env.example. IMAGE_TAG is empty in the example, so the command sets one
      - name: Check the compose file
        run: |
          cp .env.example .env
          IMAGE_TAG=ci docker compose -f compose.production.example.yml config --quiet

  names:
    name: File names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # ls-lint reads the names of the files and never opens one, the rules are in .ls-lint.yml
      - name: Check the names of the files
        env:
          # renovate: datasource=npm depName=@ls-lint/ls-lint
          version: 2.3.2
        run: npx --yes "@ls-lint/ls-lint@${version}"

  renovate:
    name: Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # A broken renovate.json does not fail anything by itself, the bot just stops opening dependency pull requests. The strict
      # mode also fails on an option that was renamed or removed, which the bot would only migrate with a warning
      - name: Validate renovate.json
        env:
          # renovate: datasource=npm depName=renovate
          version: 44.174.0
        run: npx --yes --package "renovate@${version}" renovate-config-validator --strict
