# The naming of the files of the repository, checked by the File names job of config.yaml and described in docs/ci-cd.md.
# A file name has no extension rule of its own when it has none at all, such as Dockerfile and LICENSE.
ls:
  # a folder is lowercase words joined by hyphens, and a leading dot marks the folder of a tool
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*

  # every other file is the same, with dots for a variant such as compose.production.example.yml. ls-lint picks a rule by the number
  # of parts after the first dot, so a name with two or three dots needs its own key to be checked at all
  .*: kebab-case
  .*.*: kebab-case
  .*.*.*: kebab-case

  # a Go file is lowercase words with no separator, and only _test may follow them
  .go: regex:[a-z0-9]+(_test)?

  # the community files in capitals such as README.md and CODE_OF_CONDUCT.md are allowed next to kebab case
  .md: kebab-case | SCREAMING_SNAKE_CASE

  # a YAML file in the root folder ends with .yml, because an exists rule only looks at the folder that holds it, and the workflows below end with .yaml
  .yaml: exists:0

  # a workflow ends with .yaml and not .yml, because the name of the workflow file is part of the identity that signs an image
  .github/workflows:
    .yml: exists:0
    .yaml: kebab-case

ignore:
  - .git
  - node_modules
  - dist
  - coverage
  # GitHub names the issue forms by what the person sees
  - .github/ISSUE_TEMPLATE
